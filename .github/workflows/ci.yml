name: CI

# The bundle CI the platform ships, in x-lang's .github/workflows/bundle.yml:
# the suite on every operating system x-lang is tested on, against the release
# lang.xon declares and against main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because x-lang can move while this repository sits still.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  ci:
    uses: jonruttan/x-lang/.github/workflows/bundle.yml@main
